<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimby Gamificación</title>
    <!-- Favicon -->
    <link rel="icon" href="https://s3.amazonaws.com/botgen/Uploads/kimbylogo_1729282653.png" type="image/png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="style.css">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Sección de video -->
    <div class="video-container" id="video-section">
        <video id="intro-video" autoplay loop muted playsinline>
            <source src="https://s3.amazonaws.com/botgen/Uploads/cargilvideo_1731614337.mp4" type="video/mp4">
            Tu navegador no soporta el video.
        </video>
        <button id="continue-button">Continuar</button>
    </div>
  
    <!-- Formulario de acceso -->
    <div class="container form-container" id="form-section" style="display: none;">
        <h2>Formulario de acceso</h2>
        <form id="access-form">
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="age">Edad:</label>
                <input type="number" id="age" name="age" class="form-control" min="10" required>
            </div>
            <div class="form-group">
                <label for="phone">Número de teléfono:</label>
                <input type="tel" id="phone" name="phone" class="form-control" required>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" id="consent" name="consent" class="form-check-input" required>
                <label for="consent" class="form-check-label">
                    Autorizo el uso de mis datos personales
                </label>
            </div>
            <button type="submit" id="submit-btn">Continuar</button>
        </form>
        <div id="error-message" class="text-danger mt-2" style="display: none;">
            Por favor complete todos los campos y acepte la política de privacidad.
        </div>
    </div>

    <!-- Landing Page -->
    <div class="container" id="landing-page" style="display: none;">
        <!-- Imagen principal -->
        <img src="https://s3.amazonaws.com/botgen/Uploads/flow_1729273433.png" alt="Pon a prueba tu flow" class="header-image mx-auto d-block">

        <div class="button-container">
            <div class="button-wrapper">
                <a href="https://interacty.me/projects/57412e3b5cd609ff" class="button-link" target="_blank">
                    <div class="button">
                        <div class="button-title">Concéntrese</div>
                        <img src="https://s3.amazonaws.com/botgen/Uploads/concentrse_1729273191.png" alt="Concéntrese Icon" class="button-icon">
                    </div>
                </a>
            </div>
            <div class="button-wrapper">
                <a href="https://interacty.me/projects/f7349e52b2d802ff" class="button-link" target="_blank">
                    <div class="button">
                        <div class="button-title">Crucigrama</div>
                        <img src="https://s3.amazonaws.com/botgen/Uploads/cruci_1731613465.png" alt="Crucigrama Icon" class="button-icon">
                    </div>
                </a>
            </div>
            <div class="button-wrapper">
                <a href="https://interacty.me/projects/c5dcd5afcfc592fb" class="button-link" target="_blank">
                    <div class="button">
                        <div class="button-title">Rompecabezas deslizante</div>
                        <img src="https://s3.amazonaws.com/botgen/Uploads/puzzledezlizante_1731614710.png" alt="Rompecabezas deslizante Icon" class="button-icon">
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- jQuery y Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JS personalizado -->
    <script src="scripts.js"></script>
</body>
</html>
